<!doctype html><meta charset="utf-8"><title>go build parallelism</title>
<pre id="log" style="background:#0e0c14;color:#cdd2da;font:13px/1.5 monospace;padding:1em"></pre>
<script>
// Cross-origin isolation, without a server that can set headers. SharedArrayBuffer
// — and so fsbridge, and so compiles that do not freeze the tab — is only granted
// to a cross-origin-isolated page, and GitHub Pages cannot send COOP/COEP. coi-sw.js
// adds them to its own responses; this reloads once, after the worker takes control,
// because the FIRST navigation came from Pages without them. Guarded so a browser
// where it cannot work reloads once and then stops.
(function () {
  if (window.crossOriginIsolated || !('serviceWorker' in navigator)) return;
  var KEY = 'coi-sw-reloaded';
  navigator.serviceWorker.register('coi-sw.js', { scope: './' }).then(function () {
    if (navigator.serviceWorker.controller) return; // already tried and still not isolated
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (sessionStorage.getItem(KEY)) return;
      try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
      location.reload();
    });
  }).catch(function () {});
})();
</script>
<script src="jsfs.js"></script>
<script src="fsbridge.js"></script>
<script src="wasm_exec.js"></script>
<script src="proc.js"></script>
<script>
// A late timer callback from an exited child's Go runtime can surface as an
// "already exited" error; proc.js swallows the resume, so drop the noise here.
window.addEventListener("error", function(e){ if(e.message && /already exited/.test(e.message)){ e.preventDefault(); } });
(async function () {
  const logEl = document.getElementById("log");
  const log = (l) => { logEl.textContent += l + "\n"; try{console.log(l);}catch(_){} };
  let buf="";
  const sink=(b)=>{ buf+=new TextDecoder().decode(b); let i; while((i=buf.indexOf("\n"))>=0){ log("  | "+buf.slice(0,i)); buf=buf.slice(i+1);} };
  jsfs.stdio.stdout=sink; jsfs.stdio.stderr=sink;
  // cache:"reload" is not paranoia. The toolchain wasm is served with no
  // Cache-Control, so the browser gives it a heuristic freshness lifetime
  // derived from its age — and a freshly rebuilt go-proc.wasm was then still
  // answered from cache without revalidating. That is a measurement reporting
  // the OLD toolchain's behavior with none of the usual symptoms of staleness:
  // it costs an afternoon exactly once.
  const fetchBytes=async(u)=>new Uint8Array(await (await fetch(u,{cache:"reload"})).arrayBuffer());

  // The tab's GOROOT: the tools cmd/go execs (compile/link/asm) live under
  // pkg/tool, and the whole std library source under src — cmd/go compiles it.
  jsfs.mkdirp("/goroot/pkg/tool/js_wasm");
  jsfs.mkdirp("/gopath"); jsfs.mkdirp("/work"); jsfs.mkdirp("/root"); jsfs.mkdirp("/tmp");
  jsfs.writeFile("/goroot/pkg/tool/js_wasm/compile", await fetchBytes("compile-proc.wasm"), 0o755);
  jsfs.writeFile("/goroot/pkg/tool/js_wasm/link",    await fetchBytes("link-proc.wasm"),    0o755);
  jsfs.writeFile("/goroot/pkg/tool/js_wasm/asm",     await fetchBytes("asm-proc.wasm"),     0o755);
  jsfs.writeFile("/goroot/VERSION", "go1.27.0\n"); // cmd/go checks this to accept GOROOT

  log("seeding std source (the in-tab GOROOT)…");
  const std=await (await fetch("stdsrc.json")).json();
  let nseed=0;
  for(const path in std){ jsfs.writeFile(path, Uint8Array.from(atob(std[path]),c=>c.charCodeAt(0))); nseed++; }
  log("seeded "+nseed+" std source files");

  // The program to build: an ordinary fmt hello-world in its own module.
  jsfs.writeFile("/work/go.mod", "module probe\n\ngo 1.27\n");
  jsfs.writeFile("/work/main.go", "package main\n\nimport \"fmt\"\n\nfunc main(){ fmt.Println(\"hi\") }\n");

  const bytes=await fetchBytes("go-proc.wasm");
  async function run(argv, cache){
    log("$ "+argv.join(" "));
    jsfs.setCwd("/work");
    const go=new Go();
    go.argv=argv;
    go.env={GOOS:"js",GOARCH:"wasm",GOROOT:"/goroot",GOPATH:"/gopath",HOME:"/root",TMPDIR:"/tmp",PATH:"/goroot/pkg/tool/js_wasm",GOPROXY:"off",GOFLAGS:"-mod=mod",GOSUMDB:"off",GOTOOLCHAIN:"local",GOCACHE:cache,GO111MODULE:"on"};
    jsfs.mkdirp(cache);
    let code=0; go.exit=(c)=>{code=c;};
    const {instance}=await WebAssembly.instantiate(bytes, go.importObject);
    const hung=new Promise(r=>setTimeout(()=>r("HUNG"),300000));
    const r=await Promise.race([go.run(instance).then(()=>"done"),hung]);
    log("("+(r==="HUNG"?"HUNG":"exit "+code)+")");
    return r;
  }

  // Compiles run in Workers now, so several COULD run at once. Whether they do
  // is a cmd/go question: it takes its default -p from runtime.GOMAXPROCS(0),
  // and on js/wasm that is 1 — which would leave the build serial no matter how
  // many workers are available. The overlay's cmd/go/internal/cfg/buildp_js.go
  // now sets that default from navigator.hardwareConcurrency instead, so this
  // probe sweeps explicit -p values AND runs one build with no -p at all, which
  // is the case that has to come out parallel for the change to be worth
  // anything.
  //
  // Each run gets its own GOCACHE, or the second build is a cache hit measuring
  // nothing.
  function meter(){
    let inflight=0,max=0,total=0,onthread=0;
    const rawW=proc.spawnWorker, rawS=proc.spawn;
    proc.spawnWorker=function(){
      inflight++; total++; if(inflight>max) max=inflight;
      const c=rawW.apply(proc,arguments);
      c.exited.then(function(){ inflight--; });
      return c;
    };
    proc.spawn=function(){ onthread++; return rawS.apply(proc,arguments); };
    return { stop:function(){ proc.spawnWorker=rawW; proc.spawn=rawS; return {max:max,total:total,onthread:onthread}; } };
  }

  // A cheap content check on the output. The point of a parallelism change is
  // that it changes only the schedule, so every run must produce byte-identical
  // bytes; comparing lengths alone would miss a genuinely miscompiled binary.
  function fnv(b){ let h=0x811c9dc5>>>0; for(let i=0;i<b.length;i++){ h^=b[i]; h=Math.imul(h,0x01000193)>>>0; } return h.toString(16); }

  async function measure(label,p){
    const m=meter();
    // Timers in a HIDDEN tab are throttled to about one callback a minute, so
    // anything measured there is fiction. Record the state rather than trusting
    // the operator to keep the tab in front.
    const vis0=document.visibilityState;
    const t0=performance.now();
    const argv=["go","build"];
    if(p!==null) argv.push("-p",String(p));
    argv.push("-o","/work/out-"+label+".wasm",".");
    await run(argv,"/root/.cache/gc-"+label);
    const ms=performance.now()-t0;
    const st=m.stop();
    const out=jsfs.readFile("/work/out-"+label+".wasm");
    const vis=(vis0==="visible"&&document.visibilityState==="visible")?"visible":"HIDDEN(discard)";
    log("  "+label+": "+(ms/1000).toFixed(1)+"s  peak-concurrent="+st.max+
        "  children="+st.total+"  on-thread="+st.onthread+
        "  out="+(out?out.length:0)+"B/"+(out?fnv(out):"-")+"  tab="+vis);
    return {label:label,p:p,ms:ms,max:st.max,total:st.total,onthread:st.onthread,
            bytes:out?out.length:0,hash:out?fnv(out):"",visible:vis==="visible"};
  }

  // ?p=def,1,2,4 — "def" means no -p at all, i.e. whatever cmd/go defaults to,
  // which is the run that matters. 8 is deliberately not in the default plan:
  // it hung the page thread outright on two of three attempts here, and a probe
  // whose default invocation can wedge the tab is not one anyone will run.
  const q=new URLSearchParams(location.search);
  const plan=(q.get("p")||"def,1,2,4").split(",").map(s=>s.trim()).filter(Boolean);

  log("== parallelism: does the default -p overlap the workers? ==");
  log("crossOriginIsolated="+!!window.crossOriginIsolated+
      "  navigator.hardwareConcurrency="+navigator.hardwareConcurrency+
      "  deviceMemory="+(navigator.deviceMemory||"?"));
  const results=[];
  for(const s of plan){
    results.push(await measure(s, s==="def"?null:parseInt(s,10)));
  }
  log("");
  const base=results.find(r=>r.label==="1")||results[0];
  for(const r of results){
    log("  "+r.label.padEnd(4)+" "+(r.ms/1000).toFixed(1).padStart(7)+"s  peak="+r.max+
        "  speedup-vs-p1="+(base?(base.ms/r.ms).toFixed(2):"?")+"x");
  }
  const hashes=new Set(results.filter(r=>r.bytes).map(r=>r.hash));
  log("outputs identical across runs: "+(hashes.size===1?"yes":"NO ("+hashes.size+" distinct)"));
  const def=results.find(r=>r.label==="def");
  if(def) log("PARALLEL-RESULT: default -p reached peak "+def.max+" concurrent workers");
  window.RESULT=results;
  window.DONE=true;
  log("== done ==");
})();
</script>
